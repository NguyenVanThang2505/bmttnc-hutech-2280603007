<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess the Image!</title>
    <style>
        body {
            text-align: center;
            background-color: #ffcc00;
            font-family: 'Comic Sans MS', cursive, sans-serif;
        }
        h1 {
            font-size: 50px;
            color: #ff3366;
            text-shadow: 2px 2px #fff;
        }
        .game-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }
        .hidden-img {
            width: 250px;
            height: 250px;
            border-radius: 10px;
            background-color: black;
            cursor: pointer;
        }
        .sample-img {
            width: 250px;
            height: auto;
            border-radius: 10px;
            box-shadow: 5px 5px 15px rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
        }
        .back-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 18px;
            color: white;
            background: #ff3366;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .back-btn:hover {
            background: #ff6699;
        }
    </style>
</head>
<body>
    <h1>🎉 Guess the Correct Image! 🎉</h1>
    <p>Memorize the image below, then pick the correct one!</p>
    <img id="sampleImage" class="sample-img">
    <div class="game-container">
        <div class="hidden-img" id="img1" onclick="revealImage(0)"></div>
        <div class="hidden-img" id="img2" onclick="revealImage(1)"></div>
        <div class="hidden-img" id="img3" onclick="revealImage(2)"></div>
    </div>
    <p id="result"></p>
    <button class="back-btn" onclick="window.location.href='index'">Go Back</button>

    <script>
        const images = [
            "https://i.pinimg.com/originals/0e/33/30/0e3330287169a30f2df9ce0d137f7031.gif",
            "https://cdn.piepme.com/14333/images/piep-hbONZBBc15917116462881591711646288.gif",
            "https://pa1.aminoapps.com/7825/2ef1419c9fe88e6492ca8d671edd58bbcbc14658r1-370-286_00.gif"
        ];

        let correctIndex = Math.floor(Math.random() * 3);
        document.getElementById("sampleImage").src = images[correctIndex];
        
        let shuffledImages = images.slice().sort(() => Math.random() - 0.5);
        
        function revealImage(index) {
            document.getElementById("img1").style.backgroundImage = `url(${shuffledImages[0]})`;
            document.getElementById("img2").style.backgroundImage = `url(${shuffledImages[1]})`;
            document.getElementById("img3").style.backgroundImage = `url(${shuffledImages[2]})`;
            document.getElementById("img1").style.backgroundSize = "cover";
            document.getElementById("img2").style.backgroundSize = "cover";
            document.getElementById("img3").style.backgroundSize = "cover";

            if (shuffledImages[index] === images[correctIndex]) {
                document.getElementById("result").innerHTML = "🎉 Correct! You win! 🎉";
            } else {
                document.getElementById("result").innerHTML = "❌ Wrong! Try again.";
            }
        }
    </script>
</body>
</html>
